title = "Lucy Nails exact documented secret-scan exceptions"

[extend]
useDefault = true

[[rules]]
id = "curl-auth-header"

[[rules.allowlists]]
description = "Exact illustrative curl command with explicit placeholder"
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)\.claude/skills/kinescope/SKILL\.md$''']
regexes = ['''^curl\ \-\-location\ \-\-request\ PUT\ 'https://api\.kinescope\.io/v2/live/events/\{\{event_id\}\}'\ \\\r?\n\ \ \-\-header\ 'Content\-Type:\ application/json'\ \\\r?\n\ \ \-\-header\ 'Authorization:\ Bearer\ your_api_token_here'$''']

