[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Consent localStorage key name, not a credential"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)frontend/src/lib/attribution\.ts$''']
regexes = ['''^lucy_consent_v1$''']

[[rules.allowlists]]
description = "Variable name after empty private-key path, not a value"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)\.env\.example$''']
regexes = ['''^KINESCOPE_JWT_PRIVATE_KEY_PEM=?$''']

[[rules.allowlists]]
description = "Exact synthetic production-config validation fixture"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)backend/tests/test_production_hardening\.py$''']
regexes = ['''^distinct\-mfa\-encryption\-key\-32\-chars\-min$''']
