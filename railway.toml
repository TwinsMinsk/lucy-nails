[build]
builder = "RAILPACK"

[common]
restartPolicyType = "ON_FAILURE"

# === Backend Service ===
[service.backend]
root = "backend"
buildCommand = "pip install -r requirements.txt"
# Миграции перед стартом (как в backend/Procfile), чтобы схема БД совпадала с кодом.
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=\"${FORWARDED_ALLOW_IPS:-127.0.0.1}\""
healthcheckPath = "/health"
healthcheckTimeout = 30

# === Frontend Service ===
[service.frontend]
root = "frontend"
buildCommand = "npm run build"
startCommand = "npm start"
